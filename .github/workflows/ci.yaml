name: CI workflow

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run a sample command
      run: echo "Hello, CI!"

    - name: setup python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest streamlit

    - name: run tests
      run: |
        pytest _test.py
